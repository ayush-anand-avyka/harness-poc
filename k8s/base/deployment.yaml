apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-poc-app
  labels:
    app: harness-poc-app
    managed-by: harness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-poc-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: harness-poc-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      serviceAccountName: harness-poc-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: harness-poc-app
          image: <+artifact.image>
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: harness-poc-app-config
                  key: NODE_ENV
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: harness-poc-app-config
                  key: APP_VERSION
            - name: DEPLOY_REGION
              valueFrom:
                configMapKeyRef:
                  name: harness-poc-app-config
                  key: DEPLOY_REGION
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: harness-registry-cred
