inputSet:
  name: CI Main Branch
  identifier: ci_main_inputset
  projectIdentifier: harness_poc
  orgIdentifier: default
  tags:
    branch: main

  pipeline:
    identifier: harness_poc_ci
    properties:
      ci:
        codebase:
          build:
            type: branch
            spec:
              branch: main
    variables:
      - name: har_registry_host
        type: String
        value: pkg.harness.io   # Replace with your actual HAR host
